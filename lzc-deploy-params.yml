params:
    - id: admin_password
      type: secret
      name: "Admin password"
      description: "Password for /admin, at least 12 characters. Stored only in the app's environment; it is never written into the database."
      default_value: ""

    - id: llm_base_url
      type: string
      name: "Model API base URL"
      description: "Any OpenAI-compatible endpoint, e.g. https://api.deepseek.com/v1 or https://dashscope.aliyuncs.com/compatible-mode/v1."
      default_value: "https://api.deepseek.com/v1"

    - id: llm_api_key
      type: secret
      name: "Model API key"
      description: "Key for the endpoint above. The site cannot collect or summarize anything without it."
      default_value: ""

    - id: llm_model
      type: string
      name: "Model"
      description: "Model id (or one of the presets the app knows) used by every step by default, e.g. deepseek-chat."
      default_value: "deepseek-chat"

